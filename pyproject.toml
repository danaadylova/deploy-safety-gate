[project]
name = "deploy-safety-gate"
version = "0.1.0"
description = "Does a deployment change make a model less safe? Run, judge, compare, and gate with real statistics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dsg = "dsg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
